name: aiir commit receipts

# Dogfood, surface A: this repo is heavily AI-assisted by design, so it emits
# AIIR commit receipts (aiir/commit_receipt.v2) for its own commits. Honest
# provenance of how the atlas was built, using Invariant's own open tool.
# (Surface B, the research-evidence receipts for each ledger claim, is generated
# by ledger/emit_receipts.py and gated in validate.yml.)

on:
  push:
  pull_request:

permissions:
  contents: read
  id-token: write   # for Sigstore keyless signing (Tier 2)

jobs:
  receipts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Pinned to a full commit SHA (not the mutable @v1 tag), the supply-chain
      # practice AIIR itself recommends, dogfooded here.
      - uses: invariant-systems-ai/aiir@a54fe440a2be18fe51ad30149f1bbab944d578e5  # v1
        with:
          sign: true        # Tier 2: Sigstore-signed, audit-grade
